[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-xray-classifier"
version = "0.1.0"
description = "Binary classifier for normal vs pneumonia chest X-rays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tensorflow>=2.12.0",
  "numpy>=1.24.0",
  "pandas>=2.0",
  "matplotlib>=3.72",
  "pillow>=10.0",
  "opencv-python-headless>=4.9.0",
  "streamlit>=1.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
